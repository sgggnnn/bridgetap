name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish
        required: true
        default: v1.7.0
      project:
        description: Modrinth project ID or slug (optional if configured or auto-detected)
        required: false

permissions:
  contents: read

concurrency:
  group: modrinth-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Use the triggering revision for publishing tools; binaries always come from the release.
      - name: Checkout publishing tools
        uses: actions/checkout@v4

      - name: Download the tested GitHub release artifacts
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.jar' --pattern 'SHA256SUMS.txt'
          (cd dist && sha256sum --check --ignore-missing SHA256SUMS.txt)
          gh release view "$RELEASE_TAG" --json body --jq .body > release-notes.md
          python3 - <<'PY'
          import json, os, re, subprocess
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+[.][0-9]+[.][0-9]+(?:-[A-Za-z0-9.]+)?', tag):
              raise SystemExit('Unsupported release tag')
          meta=json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isPrerelease']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('version='+tag[1:]+'\n')
              f.write('type='+('beta' if meta['isPrerelease'] else 'release')+'\n')
          PY
        id: release

      - name: Resolve Modrinth project
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN || secrets.BRIDGERTAP }}
          MODRINTH_PROJECT: ${{ inputs.project || vars.MODRINTH_PROJECT_ID }}
        run: python3 scripts/resolve-modrinth.py

      - name: Publish Forge edition
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN || secrets.BRIDGERTAP }}
          files: dist/*-Forge-1.8.9.jar
          name: BridgeTap ${{ steps.release.outputs.version }} - Forge
          version: ${{ steps.release.outputs.version }}-forge
          version-type: ${{ steps.release.outputs.type }}
          loaders: forge
          game-versions: 1.8.9
          environment: client
          changelog-file: release-notes.md

      - name: Publish OneClient and Ornithe Fabric edition
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3.2
        with:
          modrinth-id: ${{ steps.modrinth.outputs.project }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN || secrets.BRIDGERTAP }}
          files: dist/*-OneClient.jar
          name: BridgeTap ${{ steps.release.outputs.version }} - OneClient / Ornithe
          version: ${{ steps.release.outputs.version }}-oneclient
          version-type: ${{ steps.release.outputs.type }}
          loaders: |
            fabric
            ornithe
          game-versions: 1.8.9
          environment: client
          changelog-file: release-notes.md
