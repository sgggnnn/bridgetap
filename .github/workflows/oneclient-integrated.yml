name: Build bridgetapclient
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run native integration tests without rebuilding the executable
        type: boolean
        default: false
  push:
    branches: [codex/oneclient-integrated-build]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build native BridgeTap payload when no prebuilt is supplied
        if: hashFiles('integrations/oneclient/payload/BridgeTap-OneClient.jar') == ''
        run: ./gradlew.bat build -PoneclientJavaHome="$env:JAVA_HOME"
      - name: Validate payload handling
        run: python tests/test_oneclient_payload.py
      - name: Prepare integrated source
        shell: pwsh
        run: |
          $payload = 'integrations/oneclient/payload/BridgeTap-OneClient.jar'
          if (!(Test-Path $payload)) {
            $version = (Get-Content src/main/resources/fabric.mod.json -Raw | ConvertFrom-Json).version
            $payload = "build/libs/BridgeTap-$version-OneClient.jar"
          }
          python integrations/oneclient/prepare-launcher.py --jar $payload --destination build/BridgeTapClient
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'build/BridgeTapClient -> target'
          cache-on-failure: true
      - name: Build bridgetapclient
        if: ${{ !inputs.verify_only }}
        working-directory: build/BridgeTapClient
        run: cargo build --locked --release -p oneclient_app
      - name: Collect executable
        if: ${{ !inputs.verify_only }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/BridgeTapClient/target/release/oneclient_app.exe dist/bridgetapclient.exe
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.verify_only }}
        with:
          name: bridgetapclient-windows-x64
          path: dist/bridgetapclient.exe
          if-no-files-found: error
      - name: Test bundled default and opt-out persistence
        working-directory: build/BridgeTapClient
        run: cargo test --locked -p oneclient_core --lib bridgetap::tests
